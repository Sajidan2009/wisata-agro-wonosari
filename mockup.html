<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Outbound Indonesia - MacBook Pro Showcase Mockup</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    :root {
      --desk-dark: #121013;
      --desk-wood: #1E1719;
      --mac-metal: #232226;
      --mac-bezel: #0F0E10;
      --gold-accent: #D4AF37;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #2A1A20 0%, #140D10 70%, #0A0608 100%);
      min-height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #FFFFFF;
    }

    /* Desk Header Bar */
    .showcase-header {
      background: rgba(107, 29, 47, 0.95);
      border-bottom: 2px solid #D4AF37;
      padding: 14px 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .showcase-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .showcase-title span {
      color: #D4AF37;
    }

    /* Professional Minimalist Desk Surface */
    .desk-environment {
      position: relative;
      max-width: 1400px;
      margin: 40px auto;
      padding: 20px 40px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Gold Accented Plant (Left Desk Accessory) */
    .desk-accessory-plant {
      position: absolute;
      left: 20px;
      top: 60px;
      width: 160px;
      height: 240px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }

    .plant-leaves {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #2D5A27 0%, #1A3817 100%);
      border-radius: 50% 50% 40% 40%;
      position: relative;
      box-shadow: inset 0 6px 15px rgba(255,255,255,0.15);
    }

    .plant-leaves::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 25px;
      width: 80px;
      height: 80px;
      background: #3B7A33;
      border-radius: 50%;
    }

    .plant-pot {
      width: 90px;
      height: 95px;
      background: linear-gradient(135deg, #2B2628 0%, #1A1718 100%);
      border: 2.5px solid #D4AF37;
      border-radius: 8px 8px 24px 24px;
      margin-top: -10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(212, 175, 55, 0.3);
      position: relative;
    }

    .plant-pot-ring {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      height: 6px;
      background: #D4AF37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* Gold Accented Executive Notebook (Right Desk Accessory) */
    .desk-accessory-notebook {
      position: absolute;
      right: 30px;
      bottom: 80px;
      width: 170px;
      height: 220px;
      background: linear-gradient(135deg, #4A121F 0%, #2A0912 100%);
      border: 2px solid #D4AF37;
      border-radius: 6px 14px 14px 6px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset -4px 0 10px rgba(0,0,0,0.5);
      z-index: 1;
      transform: rotate(-12deg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .notebook-spine {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      background: #D4AF37;
      border-radius: 4px 0 0 4px;
    }

    .notebook-emblem {
      color: #D4AF37;
      font-size: 1.8rem;
      text-align: center;
      margin-top: 40px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .notebook-pen {
      position: absolute;
      right: -15px;
      top: 30px;
      width: 10px;
      height: 180px;
      background: linear-gradient(135deg, #D4AF37 0%, #997A1E 100%);
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transform: rotate(5deg);
    }

    /* MacBook Pro Body Mockup Container */
    .macbook-container {
      position: relative;
      width: 100%;
      max-width: 1060px;
      z-index: 2;
    }

    /* MacBook Screen Display Frame */
    .macbook-screen-frame {
      background: #0A0A0B;
      border: 3px solid #2D2B30;
      border-radius: 20px 20px 0 0;
      padding: 14px 14px 0 14px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(107, 29, 47, 0.3);
      position: relative;
    }

    /* Screen Camera Notch */
    .macbook-camera {
      width: 12px;
      height: 12px;
      background: #1A1A1C;
      border: 1px solid #3A3A3D;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      position: relative;
    }

    .macbook-camera::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: #0F355C;
      border-radius: 50%;
      top: 3px;
      left: 3px;
    }

    /* Screen Display Window */
    .macbook-display {
      position: relative;
      width: 100%;
      height: 590px;
      background: #FFFFFF;
      border-radius: 6px 6px 0 0;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .macbook-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Glass Screen Reflection Overlay */
    .screen-reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.03) 30%,
        transparent 55%
      );
      pointer-events: none;
      z-index: 10;
    }

    /* MacBook Base Frame & Trackpad */
    .macbook-base {
      width: 108%;
      margin-left: -4%;
      height: 24px;
      background: linear-gradient(180deg, #3A383E 0%, #201F23 60%, #151417 100%);
      border-radius: 0 0 20px 20px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      border-top: 1px solid #4A4850;
    }

    .macbook-notch {
      width: 140px;
      height: 10px;
      background: #18171A;
      margin: 0 auto;
      border-radius: 0 0 10px 10px;
    }

    /* Desk Shadow */
    .desk-shadow {
      width: 110%;
      margin-left: -5%;
      height: 35px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, transparent 70%);
      margin-top: -10px;
      pointer-events: none;
    }

    /* Responsive Adjustments */
    @media (max-width: 992px) {
      .desk-accessory-plant, .desk-accessory-notebook {
        display: none;
      }
      .macbook-display {
        height: 480px;
      }
    }

    @media (max-width: 576px) {
      .macbook-display {
        height: 360px;
      }
    }
  </style>
</head>

<body>

  <!-- Top Showcase Header -->
  <header class="showcase-header d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <div class="showcase-title">
        <i class="fa-solid fa-crown me-2 text-warning"></i>
        <span>EXECUTIVE OUTBOUND</span> INDONESIA MOCK-UP
      </div>
      <span class="badge bg-warning text-dark fw-bold px-3 py-2 rounded-pill d-none d-md-inline-block">
        <i class="fa-solid fa-gem me-1"></i> Maroon &amp; Gold Edition
      </span>
    </div>

    <!-- Quick Navigation Switcher -->
    <div class="d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3" target="preview-frame">
        <i class="fa-solid fa-house me-1"></i> Beranda
      </a>
      <a href="paket.html" class="btn btn-outline-light btn-sm rounded-pill px-3" target="preview-frame">
        <i class="fa-solid fa-boxes-packing me-1"></i> Paket
      </a>
      <a href="fasilitas.html" class="btn btn-outline-light btn-sm rounded-pill px-3" target="preview-frame">
        <i class="fa-solid fa-building me-1"></i> Fasilitas
      </a>
      <a href="index.html" class="btn btn-amber btn-sm rounded-pill px-3 fw-bold text-dark ms-2">
        <i class="fa-solid fa-expand me-1"></i> Open Fullsite
      </a>
    </div>
  </header>

  <!-- Minimalist Executive Desk Environment -->
  <main class="desk-environment">

    <!-- Gold Accented Plant Accessory -->
    <div class="desk-accessory-plant">
      <div class="plant-leaves"></div>
      <div class="plant-pot">
        <div class="plant-pot-ring"></div>
      </div>
    </div>

    <!-- Gold Accented Executive Notebook Accessory -->
    <div class="desk-accessory-notebook">
      <div class="notebook-spine"></div>
      <div class="notebook-emblem">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <small class="text-center text-gold fw-bold" style="font-size:0.65rem;letter-spacing:1px;color:#D4AF37;">
        EXECUTIVE NOTES
      </small>
      <div class="notebook-pen"></div>
    </div>

    <!-- MacBook Pro Display Device Container -->
    <div class="macbook-container">
      <div class="macbook-screen-frame">
        <div class="macbook-camera"></div>

        <!-- Live Website Frame inside MacBook Screen -->
        <div class="macbook-display">
          <iframe src="index.html" name="preview-frame" class="macbook-iframe" title="Executive Outbound Website Preview"></iframe>
          <div class="screen-reflection"></div>
        </div>
      </div>

      <!-- MacBook Metallic Base & Trackpad Notch -->
      <div class="macbook-base">
        <div class="macbook-notch"></div>
      </div>

      <!-- Soft Realistic Desk Drop Shadow -->
      <div class="desk-shadow"></div>
    </div>

  </main>

  <!-- Footer Info Bar -->
  <footer class="text-center py-3" style="background: rgba(10,6,8,0.8); border-top: 1px solid rgba(212,175,55,0.2);">
    <div class="container">
      <small class="text-white-50">
        <strong class="text-warning">High-Fidelity UI/UX Re-skin:</strong> Maroon (#6B1D2F) • Gold (#D4AF37) • White (#FFFFFF) Palette
      </small>
    </div>
  </footer>

</body>

</html>
